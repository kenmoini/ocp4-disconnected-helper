name: 'Ansible Lint and Refactor'
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ansible-lint-and-refactor:
    runs-on: ubuntu-latest
    env:
      OLLAMA_API_BASE: ${{ secrets.OLLAMA_API_BASE }}
      MODEL: ${{ secrets.MODEL }}
      EDITOR_MODEL: ${{ secrets.EDITOR_MODEL }}
      PLAYBOOKS_DIR: '/workspace/playbooks/'
      TASKS_DIR: '/workspace/playbooks/tasks/'
    container:
      image: 'quay.io/takinosh/ansible-lint-and-refactor:b9c0ace9f2dbb79797f9544ea5fd9af42338fcb7'

    steps:
      - name: Run Ansible Lint and Refactor in Container
        uses: addnab/docker-run-action@v3
        with:
          image: quay.io/takinosh/ansible-lint-and-refactor:b9c0ace9f2dbb79797f9544ea5fd9af42338fcb7
          options: |
            -v ${{ github.workspace }}:/workspace
            -e OLLAMA_API_BASE=${{ secrets.OLLAMA_API_BASE }}
            -e MODEL=${{ secrets.MODEL }}
            -e EDITOR_MODEL=${{ secrets.EDITOR_MODEL }}
            -e PLAYBOOKS_DIR=/workspace/playbooks/
            -e TASKS_DIR=/workspace/playbooks/tasks/
          run: |
            set -e
            ls -lath .
            pwd 
            exit 1
            echo ${OLLAMA_API_BASE} || exit $?
            echo "USING MODEL: ${MODEL}"
            /opt/ansible-venv/bin/ansible-lint-script.sh
      