name: 'Ansible Lint and Refactor'
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ansible-lint-and-refactor:
    runs-on: ubuntu-latest
    env:
      OLLAMA_API_BASE: ${{ secrets.OLLAMA_API_BASE }}
      MODEL: ${{ secrets.MODEL }}
      EDITOR_MODEL: ${{ secrets.EDITOR_MODEL }}
      PLAYBOOKS_DIR: 'playbooks/'
      TASKS_DIR: 'playbooks/tasks/'
    container:
      image: 'quay.io/takinosh/ansible-lint-and-refactor:694a037776d8af9e13e82541a02715dba55dcf73'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Ansible Lint and Refactor in Container
        uses: addnab/docker-run-action@v3
        with:
          image: quay.io/yourusername/ansible-lint-and-refactor:latest
          options: -v ${{ github.workspace }}:/workspace
          run: |
            chmod +x /opt/ansible-venv/bin/ansible-lint-script.sh
            /opt/ansible-venv/bin/ansible-lint-script.sh /workspace
      