name: 'Ansible Lint and Refactor'
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ansible-lint-and-refactor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4 # Required to mount the Github Workspace to a volume

      - name: Run Ansible Lint and Refactor in Container
        uses: addnab/docker-run-action@v3
        with:
          image: quay.io/takinosh/ansible-lint-and-refactor:b9c0ace9f2dbb79797f9544ea5fd9af42338fcb7
          options: |
            -v ${{ github.workspace }}:/workspace
            -e OLLAMA_API_BASE=${{ secrets.OLLAMA_API_BASE }}
            -e MODEL=${{ secrets.MODEL }}
            -e EDITOR_MODEL=${{ secrets.EDITOR_MODEL }}
            -e PLAYBOOKS_DIR=playbooks/
            -e TASKS_DIR=playbooks/tasks/
          run: |
            set -e
            ls -lath /workspace
            ls -ld /workspace/.git
            #exit 1
            cd /workspace
            echo ${OLLAMA_API_BASE} || exit $?
            echo "USING MODEL: ${MODEL}"
            /opt/ansible-venv/bin/ansible-lint-script.sh || exit $?